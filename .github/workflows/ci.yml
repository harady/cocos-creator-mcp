name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and compatibility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Compatibility checks
        run: npm run test:compat

      # dist/ is gitignored but tracked, so a file emitted by a newly added
      # source module never shows up in `git status` and silently never ships.
      # That is how dist/resources/*.js went missing from v2.0.0 until #34.
      - name: Every built file is tracked
        run: |
          untracked=$(comm -13 <(git ls-files dist | sort) <(find dist -type f -name '*.js' | sort))
          if [ -n "$untracked" ]; then
            echo "::error::These build outputs are not tracked, so they are missing from the published extension:"
            echo "$untracked"
            echo "Add them with: git add -f <path>"
            exit 1
          fi
          echo "All $(find dist -type f -name '*.js' | wc -l) built .js files are tracked."

  shipped-extension-loads:
    # Loads only what the repository actually contains -- what someone who
    # installs the repo as an extension gets -- rather than the local build
    # tree, which always looks complete even when the committed one is not.
    name: Tracked dist/ is loadable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract the tracked dist/ and load the entry point
        run: |
          target=$(mktemp -d)
          git archive HEAD dist | tar -x -C "$target"
          cd "$target"
          node -e "require('./dist/mcp-server.js')"
          echo "Tracked dist/ loads cleanly."

  dist-is-current:
    # Contributors are not asked to commit dist/; the maintainer rebuilds it in a
    # chore(release) commit. So this runs on main only, and is red between merging
    # a fix and shipping it -- the reminder that was missing when #33 merged.
    #
    # It compares commits rather than rebuilding, because the build is not
    # reproducible across platforms: inlineSources embeds the .ts files verbatim,
    # so a dist/ built on Windows (CRLF sources) never matches one built on Linux.
    name: dist/ has been rebuilt since the last source change
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare last source change against last build
        run: |
          source_commit=$(git rev-list -1 HEAD -- source tsconfig.json package.json)
          dist_commit=$(git rev-list -1 HEAD -- dist)
          echo "last source change: $(git log -1 --format='%h %s' "$source_commit")"
          echo "last dist build:    $(git log -1 --format='%h %s' "$dist_commit")"
          if ! git merge-base --is-ancestor "$source_commit" "$dist_commit"; then
            echo "::error::dist/ predates the latest source change, so the merged fix is not in the published extension. Run npm run build and commit dist/ (chore(release))."
            exit 1
          fi
          echo "dist/ includes the latest source change."
